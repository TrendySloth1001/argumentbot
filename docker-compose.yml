services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: argumentbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: argumentbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # TTS Microservice (Piper)
  tts:
    build:
      context: ./tts-service
      dockerfile: Dockerfile
    container_name: argumentbot-tts
    restart: unless-stopped
    ports:
      - "5500:5500"
    volumes:
      - ./tts-service/voices:/app/voices
      - ./tts-service/tts_cache:/app/tts_cache
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5500/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  stt-service:
    build:
      context: ./stt-service
    ports:
      - "8000:8000"

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio
    container_name: argumentbot-minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  minio_data:
